[pytest]
testpaths = src/tests
addopts =
    -ra
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
markers =
    smoke: smoke suite
    regression: regression suite
    e2e: end-to-end suite
    android: android-only tests
    ios: ios-only tests
    sauce: tests running on Sauce Labs
    quarantine: temporarily isolated flaky tests excluded from default CI suites
